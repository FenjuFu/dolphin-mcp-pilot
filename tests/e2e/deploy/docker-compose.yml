# =============================================================================
# Docker Compose for E2E testing
# =============================================================================
# Uses DolphinScheduler standalone server (all-in-one) for fast startup.
# Both services are accessible on localhost for the pytest suite.
#
# Usage:
#   docker compose -f tests/e2e/deploy/docker-compose.yml up -d
#   docker compose -f tests/e2e/deploy/docker-compose.yml down -v
# =============================================================================

services:
  # DolphinScheduler standalone (all-in-one: API + Master + Worker + DB)
  dolphinscheduler:
    image: apache/dolphinscheduler-standalone-server:${DS_VERSION:-3.4.2}
    container_name: e2e-dolphinscheduler
    environment:
      TZ: Asia/Shanghai
      # Override default 4GB heap with smaller size for testing
      JAVA_OPTS: "-server -Xms512m -Xmx2g -Xmn512m -XX:+IgnoreUnrecognizedVMOptions -XX:+ExitOnOutOfMemoryError -DDOCKER=true"
    ports:
      - "${E2E_DS_PORT:-12345}:12345"
    healthcheck:
      # Check actual API endpoint, not just static UI files
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:12345/dolphinscheduler/login", "-d", "userName=admin&userPassword=dolphinscheduler123"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  # Dolphin MCP Pilot
  dolphin-mcp-pilot:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: e2e-dolphin-mcp-pilot
    environment:
      DS_URL: http://dolphinscheduler:12345/dolphinscheduler
      DS_USER: admin
      DS_PASSWORD: dolphinscheduler123
      MCP_PORT: "8001"
    ports:
      - "${E2E_PILOT_PORT:-18001}:8001"
    depends_on:
      dolphinscheduler:
        condition: service_healthy
    healthcheck:
      # Verify MCP HTTP endpoint is responding with a tools/list request
      test: ["CMD", "python", "-c", "import urllib.request, json; req = urllib.request.Request('http://127.0.0.1:8001/mcp/', data=json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list', 'params': {}}).encode(), headers={'Content-Type': 'application/json'}, method='POST'); resp = urllib.request.urlopen(req, timeout=5); exit(0 if resp.status == 200 else 1)"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
